# Batch 5 rider payout configuration hardening.
name: ROZZI batch 5 hardening

on:
  push:
    branches: [codex/rozzifix-batch1]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: ci_test_access_secret_012345678901234567890123
      JWT_REFRESH_SECRET: ci_test_refresh_secret_012345678901234567890123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply rider payout hardening
        run: python3 .github/patches/batch5.py
      - name: Validate full repository
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm test -- --runInBand
          npm run test:e2e -- --runInBand
          cd ../apps/admin && npm ci --no-audit --no-fund && npm run build
          cd ../customer && npm ci --no-audit --no-fund && npm run build
          cd ../vendor && npm ci --no-audit --no-fund && npm run build
          cd ../rider && npm ci --no-audit --no-fund && npm run build
      - name: Commit validated batch 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          rm -f .github/patches/batch4.py .github/patches/batch5.py
          git add backend/src/modules/pricing/pricing.service.ts apps/admin/src/app/settings/pricing/page.tsx .github/workflows/rozzifix-batch3.yml .github/patches/batch4.py .github/patches/batch5.py
          if git diff --cached --quiet; then echo 'No batch 5 changes.'; else git commit -m 'fix: make rider payout rate configurable' && git pull --rebase origin codex/rozzifix-batch1 && git push; fi

# Batch 12 promotion scope hardening. Full validation is mandatory.
name: ROZZI batch 12 hardening

on:
  push:
    branches: [codex/rozzifix-batch1]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: ci_test_access_secret_012345678901234567890123
      JWT_REFRESH_SECRET: ci_test_refresh_secret_012345678901234567890123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply promotion scope hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/src/modules/wallet/wallet.service.ts')
          text = path.read_text(encoding='utf-8-sig')
          old = '''        OR: [
          { vendorId: null },
          { vendorId: dto.vendorId || undefined },
        ],'''
          new = '''        ...(dto.vendorId
          ? {
              OR: [
                { vendorId: null },
                { vendorId: dto.vendorId },
              ],
            }
          : { vendorId: null }),'''
          if old not in text:
              raise SystemExit('promotion scope block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('backend/test/unit/wallet-promotion-scope.spec.ts')
          test_path.write_text('''import { WalletService } from '../../src/modules/wallet/wallet.service';\n\ndescribe('WalletService promotion scope', () => {\n  const makeService = (promotion: any) => {\n    const prisma = {\n      promotion: {\n        findFirst: jest.fn().mockResolvedValue(promotion),\n      },\n      promotionRedemption: {\n        count: jest.fn().mockResolvedValue(0),\n      },\n    };\n    return { service: new WalletService(prisma as never), prisma };\n  };\n\n  const promotion = {\n    id: 'promotion-1',\n    code: 'SAVE10',\n    name: 'Save 10',\n    type: 'PERCENTAGE',\n    value: 10,\n    maxDiscount: null,\n    minOrderAmount: 0,\n    usageLimit: null,\n    usageCount: 0,\n    perCustomerLimit: null,\n    vendorId: 'vendor-1',\n    isActive: true,\n    startsAt: new Date(Date.now() - 1000),\n    endsAt: new Date(Date.now() + 100000),\n  };\n\n  it('only considers global promotions when vendorId is omitted', async () => {\n    const { service, prisma } = makeService(promotion);\n\n    await service.applyPromotion('customer-1', {\n      code: 'SAVE10',\n      subtotalAmount: 10000,\n    });\n\n    expect(prisma.promotion.findFirst).toHaveBeenCalledWith({\n      where: {\n        code: 'SAVE10',\n        isActive: true,\n        startsAt: { lte: expect.any(Date) },\n        endsAt: { gte: expect.any(Date) },\n        vendorId: null,\n      },\n    });\n  });\n\n  it('allows a vendor-scoped promotion only for that vendor or global fallback', async () => {\n    const { service, prisma } = makeService(promotion);\n\n    await service.applyPromotion('customer-1', {\n      code: 'SAVE10',\n      subtotalAmount: 10000,\n      vendorId: 'vendor-1',\n    });\n\n    expect(prisma.promotion.findFirst).toHaveBeenCalledWith({\n      where: {\n        code: 'SAVE10',\n        isActive: true,\n        startsAt: { lte: expect.any(Date) },\n        endsAt: { gte: expect.any(Date) },\n        OR: [\n          { vendorId: null },\n          { vendorId: 'vendor-1' },\n        ],\n      },\n    });\n  });\n});\n''', encoding='utf-8')
          PY
      - name: Validate full repository
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm test -- --runInBand
          npm run test:e2e -- --runInBand
          cd ../apps/admin && npm ci --no-audit --no-fund && npm run build
          cd ../customer && npm ci --no-audit --no-fund && npm run build
          cd ../vendor && npm ci --no-audit --no-fund && npm run build
          cd ../rider && npm ci --no-audit --no-fund && npm run build
      - name: Commit validated batch 12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add backend/src/modules/wallet/wallet.service.ts backend/test/unit/wallet-promotion-scope.spec.ts .github/workflows/rozzifix-batch3.yml
          if git diff --cached --quiet; then echo 'No batch 12 changes.'; else git commit -m 'fix: harden promotion vendor scope [skip ci]' && git push; fi

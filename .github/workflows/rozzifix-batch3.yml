# Batch 12 promotion scope hardening. Full validation is mandatory.
name: ROZZI batch 12 hardening

on:
  push:
    branches: [codex/rozzifix-batch1]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: ci_test_access_secret_012345678901234567890123
      JWT_REFRESH_SECRET: ci_test_refresh_secret_012345678901234567890123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply promotion scope hardening
        run: |
          python3 -c "from pathlib import Path; p=Path('backend/src/modules/wallet/wallet.service.ts'); s=p.read_text(encoding='utf-8-sig'); old='''        OR: [\n          { vendorId: null },\n          { vendorId: dto.vendorId || undefined },\n        ],'''; new='''        ...(dto.vendorId\n          ? { OR: [{ vendorId: null }, { vendorId: dto.vendorId }] }\n          : { vendorId: null }),'''; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')
          cat > backend/test/unit/wallet-promotion-scope.spec.ts <<'EOF'
          import { WalletService } from '../../src/modules/wallet/wallet.service';
          describe('WalletService promotion scope', () => {
            const promotion = { id:'p1', code:'SAVE10', name:'Save 10', type:'PERCENTAGE', value:10, maxDiscount:null, minOrderAmount:0, usageLimit:null, usageCount:0, perCustomerLimit:null, vendorId:'v1', isActive:true, startsAt:new Date(Date.now()-1000), endsAt:new Date(Date.now()+100000) };
            const make = () => { const prisma:any={promotion:{findFirst:jest.fn().mockResolvedValue(promotion)},promotionRedemption:{count:jest.fn().mockResolvedValue(0)}}; return {service:new WalletService(prisma),prisma}; };
            it('uses only global scope when vendorId is omitted', async () => { const {service,prisma}=make(); await service.applyPromotion('c1',{code:'SAVE10',subtotalAmount:10000}); expect(prisma.promotion.findFirst).toHaveBeenCalledWith(expect.objectContaining({where:expect.objectContaining({vendorId:null})})); });
            it('limits vendor scope to the requested vendor plus global fallback', async () => { const {service,prisma}=make(); await service.applyPromotion('c1',{code:'SAVE10',subtotalAmount:10000,vendorId:'v1'}); expect(prisma.promotion.findFirst).toHaveBeenCalledWith(expect.objectContaining({where:expect.objectContaining({OR:[{vendorId:null},{vendorId:'v1'}]})})); });
          });
          EOF
      - name: Validate full repository
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm test -- --runInBand
          npm run test:e2e -- --runInBand
          cd ../apps/admin && npm ci --no-audit --no-fund && npm run build
          cd ../customer && npm ci --no-audit --no-fund && npm run build
          cd ../vendor && npm ci --no-audit --no-fund && npm run build
          cd ../rider && npm ci --no-audit --no-fund && npm run build
      - name: Commit validated batch 12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add backend/src/modules/wallet/wallet.service.ts backend/test/unit/wallet-promotion-scope.spec.ts .github/workflows/rozzifix-batch3.yml
          if git diff --cached --quiet; then echo 'No batch 12 changes.'; else git commit -m 'fix: harden promotion vendor scope [skip ci]' && git push; fi

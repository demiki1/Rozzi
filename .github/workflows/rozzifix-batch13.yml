name: ROZZI vendor finance validation v13
on:
  push:
    branches: [codex/rozzifix-batch1]
concurrency:
  group: rozzifix-vendor-finance-v13
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: rozzi-ci-access-secret
      JWT_REFRESH_SECRET: rozzi-ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply vendor finance hardening
        run: python3 .github/patches/batch27.py
      - name: Validate backend
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm test -- --runInBand
          npm run test:e2e -- --runInBand
      - name: Validate frontends
        run: |
          cd apps/admin && npm ci --no-audit --no-fund && npm run build
          cd ../customer && npm ci --no-audit --no-fund && npm run build
          cd ../vendor && npm ci --no-audit --no-fund && npm run build
          cd ../rider && npm ci --no-audit --no-fund && npm run build
      - name: Commit validated vendor finance hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add backend/src/modules/finance/vendor-finance.service.ts .github/patches/batch27.py .github/workflows/rozzifix-batch13.yml
          if git diff --cached --quiet; then echo 'No pending vendor finance hardening changes.'; else git commit -m 'fix: correct vendor finance pending balances [skip ci]' && git push origin HEAD:codex/rozzifix-batch1; fi

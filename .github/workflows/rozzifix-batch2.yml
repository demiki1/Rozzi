name: ROZZI batch 2 hardening

on:
  push:
    branches: [codex/rozzifix-batch1]

concurrency:
  group: rozzifix-batch2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply rider settlement hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8-sig')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')

          def replace_once(s, old, new, p):
              n = s.count(old)
              if n == 0:
                  return s, False
              if n != 1:
                  raise SystemExit(f'{p}: expected at most one match, found {n}')
              return s.replace(old, new, 1), True

          # Persist the configurable rider payout rate and the historical rate
          # used for each delivered order. This is required so later admin-rate
          # changes cannot rewrite old rider earnings or refund reversals.
          p = 'backend/prisma/schema.prisma'
          s = read(p)
          s, _ = replace_once(
              s,
              '  deliveryRadiusKm Decimal @db.Decimal(6, 2)\n\n  // Surge pricing.',
              '  deliveryRadiusKm Decimal @db.Decimal(6, 2)\n\n  // Rider settlement: default is 92% rider / 8% ROZZI.\n  riderPayoutRatePercent Decimal @default(92) @db.Decimal(5, 2)\n\n  // Surge pricing.',
              p,
          )
          s, _ = replace_once(
              s,
              '  commissionRateSnapshot Decimal        @db.Decimal(5, 2)\n  pricingConfigId',
              '  commissionRateSnapshot Decimal        @db.Decimal(5, 2)\n  riderPayoutRateSnapshot Decimal?       @db.Decimal(5, 2)\n  pricingConfigId',
              p,
          )
          write(p, s)

          p = 'backend/src/modules/pricing/dto/update-pricing-config.dto.ts'
          s = read(p)
          s, _ = replace_once(
              s,
              '  deliveryRadiusKm?: number;\n\n  @IsOptional()\n  @IsBoolean()\n  surgeEnabled?: boolean;',
              '  deliveryRadiusKm?: number;\n\n  @IsOptional()\n  @IsNumber({ maxDecimalPlaces: 2 })\n  @Min(0)\n  @Max(100)\n  riderPayoutRatePercent?: number;\n\n  @IsOptional()\n  @IsBoolean()\n  surgeEnabled?: boolean;',
              p,
          )
          write(p, s)

          p = 'backend/create-default-pricing-configs.js'
          s = read(p)
          s, _ = replace_once(
              s,
              '        deliveryRadiusKm: 8,\n\n        surgeEnabled:',
              '        deliveryRadiusKm: 8,\n        riderPayoutRatePercent: 92,\n\n        surgeEnabled:',
              p,
          )
          write(p, s)

          # Ledger: derive rider earnings from the active service-area pricing
          # config, snapshot the rate on delivery, and book the ROZZI share as
          # a separate platform-revenue entry. Historical refunds use the
          # snapshot, never the current admin configuration.
          p = 'backend/src/modules/finance/ledger.service.ts'
          s = read(p)
          s, _ = replace_once(
              s,
              '        items: {\n          select: {\n            subtotalAmount: true,\n            commissionRateSnapshot: true,\n            commissionAmountSnapshot: true,\n          },\n        },\n      },\n    });',
              '        items: {\n          select: {\n            subtotalAmount: true,\n            commissionRateSnapshot: true,\n            commissionAmountSnapshot: true,\n          },\n        },\n        pricingConfig: {\n          select: {\n            riderPayoutRatePercent: true,\n          },\n        },\n      },\n    });',
              p,
          )
          old_block = '''    // Rider payout: only for platform-delivered orders with an assigned\n    // rider. KNOWN SIMPLIFICATION, flagged: the rider gets the FULL\n    // delivery fee — there's no admin-configurable split (e.g. platform\n    // keeps a cut of the delivery fee too) because §18/§78 don't specify\n    // one concretely enough to hard-code a number. If you want the\n    // platform to retain a portion of the delivery fee, this is the one\n    // place that changes.\n    if (order.delivery?.riderId) {\n      await this.record({\n        type: LedgerEntryType.RIDER_EARNING,\n        accountType: LedgerAccountType.RIDER,\n        accountId: order.delivery.riderId,\n        orderId: order.id,\n        amount: order.deliveryFeeAmount,\n        description: `Delivery payout for order ${order.orderNumber}`,\n        idempotencyKey: `order:${order.id}:rider-earning`,\n      });\n    }\n'''
          new_block = '''    const riderPayoutRate = Math.min(\n      100,\n      Math.max(0, Number(order.riderPayoutRateSnapshot ?? order.pricingConfig?.riderPayoutRatePercent ?? 92)),\n    );\n\n    if (order.riderPayoutRateSnapshot == null) {\n      await this.prisma.order.update({\n        where: { id: order.id },\n        data: { riderPayoutRateSnapshot: riderPayoutRate },\n      });\n    }\n\n    // Rider payout is configurable per service area. The default is 92%,\n    // leaving 8% of the delivery fee as ROZZI delivery revenue.\n    if (order.delivery?.riderId && order.deliveryFeeAmount > 0) {\n      const riderEarning = Math.round(\n        order.deliveryFeeAmount * riderPayoutRate / 100,\n      );\n      const rozziDeliveryShare = order.deliveryFeeAmount - riderEarning;\n\n      await this.record({\n        type: LedgerEntryType.RIDER_EARNING,\n        accountType: LedgerAccountType.RIDER,\n        accountId: order.delivery.riderId,\n        orderId: order.id,\n        amount: riderEarning,\n        description: `Delivery payout (${riderPayoutRate}% rider) for order ${order.orderNumber}`,\n        idempotencyKey: `order:${order.id}:rider-earning`,\n      });\n\n      if (rozziDeliveryShare > 0) {\n        await this.record({\n          type: LedgerEntryType.PLATFORM_COMMISSION,\n          accountType: LedgerAccountType.PLATFORM,\n          orderId: order.id,\n          amount: rozziDeliveryShare,\n          description: `Delivery revenue (${100 - riderPayoutRate}% ROZZI) for order ${order.orderNumber}`,\n          idempotencyKey: `order:${order.id}:delivery-platform-share`,\n        });\n      }\n    }\n'''
          s, _ = replace_once(s, old_block, new_block, p)

          # Refund path needs the same pricing relation and snapshot-aware rider
          # reversal. Add the relation to the second order lookup if it is not
          # already present there.
          marker = '        items: {\n          select: {\n            subtotalAmount: true,\n            commissionRateSnapshot: true,\n            commissionAmountSnapshot: true,\n          },\n        },\n      },\n    });'
          replacement = '        items: {\n          select: {\n            subtotalAmount: true,\n            commissionRateSnapshot: true,\n            commissionAmountSnapshot: true,\n          },\n        },\n        pricingConfig: {\n          select: {\n            riderPayoutRatePercent: true,\n          },\n        },\n      },\n    });'
          if s.count(marker) == 1:
              s = s.replace(marker, replacement, 1)
          elif s.count(marker) > 1:
              # The first lookup was already changed above; this should be the
              # only remaining exact shape for the refund lookup.
              s = s.replace(marker, replacement, 1)
          rider_old = "    const riderReversal = order.delivery?.riderId ? Math.min(order.deliveryFeeAmount, Math.max(0, refundAmount - vendorReversal - commissionReversal)) : 0;"
          rider_new = "    const riderRate = Math.min(100, Math.max(0, Number(order.riderPayoutRateSnapshot ?? order.pricingConfig?.riderPayoutRatePercent ?? 92)));\n    const riderEarned = Math.round(order.deliveryFeeAmount * riderRate / 100);\n    const riderReversal = order.delivery?.riderId ? Math.min(riderEarned, Math.max(0, refundAmount - vendorReversal - commissionReversal)) : 0;"
          s, _ = replace_once(s, rider_old, rider_new, p)
          write(p, s)

          # Update the existing ledger unit fixture for the new pricing lookup.
          p = 'backend/test/unit/ledger-commission.spec.ts'
          s = read(p)
          s, _ = replace_once(s, '      ledgerEntry: {\n', '      pricingConfig: {\n        findFirst: jest.fn(async () => ({ riderPayoutRatePercent: 92 })),\n      },\n      ledgerEntry: {\n', p)
          s, _ = replace_once(s, '      order: {\n        findUnique: jest.fn(async () => order),\n      },', '      order: {\n        findUnique: jest.fn(async () => order),\n        update: jest.fn(async ({ data }: any) => ({ ...order, ...data })),\n      },', p)
          s, _ = replace_once(s, '    expect(riderEntry.amount).toBe(order.deliveryFeeAmount);', '    expect(riderEntry.amount).toBe(73_600);\n    expect(created.find((e) => e.description?.includes(\'Delivery revenue (8% ROZZI)\')).amount).toBe(6_400);', p)
          s, _ = replace_once(s, '    expect(riderEntry.amount).toBeUndefined();', '    expect(riderEntry).toBeUndefined();', p) if '    expect(riderEntry.amount).toBeUndefined();' in s else (s, False)
          write(p, s)

          # Add the required migration. No database is reset or touched by CI.
          migration = Path('backend/prisma/migrations/202609120010_rider_payout_split/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          if not migration.exists():
              migration.write_text(
                  'ALTER TABLE "pricing_configs" ADD COLUMN "riderPayoutRatePercent" DECIMAL(5,2) NOT NULL DEFAULT 92.00;\n'
                  'ALTER TABLE "orders" ADD COLUMN "riderPayoutRateSnapshot" DECIMAL(5,2);\n',
                  encoding='utf-8',
              )

          # Existing admin Locations page: expose the already-admin-protected
          # pricing endpoint without creating a new dashboard architecture.
          p = 'apps/admin/src/app/locations/page.tsx'
          s = read(p)
          s, _ = replace_once(s, "  const [error, setError] = useState<string | null>(null);", "  const [error, setError] = useState<string | null>(null);\n  const [riderRateByArea, setRiderRateByArea] = useState<Record<string, string>>({});", p)
          s, _ = replace_once(s, "    api\n      .get<ServiceAreaSummary[]>('/api/admin/service-areas')\n      .then(setServiceAreas)\n      .catch((e) => setError(e.message));", "    api\n      .get<ServiceAreaSummary[]>('/api/admin/service-areas')\n      .then(async (areas) => {\n        setServiceAreas(areas);\n        const configs = await Promise.all(areas.map(async (area) => [area.id, await api.get<any>(`/api/admin/pricing/service-areas/${area.id}`)] as const));\n        setRiderRateByArea(Object.fromEntries(configs.map(([id, config]) => [id, String(config.riderPayoutRatePercent ?? 92)])));\n      })\n      .catch((e) => setError(e.message));", p)
          insert = '''\n  async function saveRiderRate(serviceAreaId: string) {\n    const value = Number(riderRateByArea[serviceAreaId]);\n    if (!Number.isFinite(value) || value < 0 || value > 100) {\n      setError('Rider payout rate must be between 0% and 100%.');\n      return;\n    }\n    try {\n      await api.patch(`/api/admin/pricing/service-areas/${serviceAreaId}`, { riderPayoutRatePercent: value });\n      setError(null);\n      load();\n    } catch (err: any) {\n      setError(err.message);\n    }\n  }\n'''
          s, _ = replace_once(s, '  async function setStatus(serviceAreaId: string, status: string) {', insert + '\n  async function setStatus(serviceAreaId: string, status: string) {', p)
          anchor = '''                <div className="mt-2 text-xs text-gray-500">\n                  Zones: {area.deliveryZones.map((z) => z.name).join(', ') || 'none yet'}\n                </div>\n'''
          config_ui = anchor + '''\n                <div className="mt-2 flex items-center gap-2">\n                  <label className="text-xs text-gray-500">Rider payout %</label>\n                  <input\n                    type="number"\n                    min="0"\n                    max="100"\n                    step="0.01"\n                    value={riderRateByArea[area.id] ?? '92'}\n                    onChange={(e) => setRiderRateByArea((prev) => ({ ...prev, [area.id]: e.target.value }))}\n                    className="w-20 rounded-md border border-gray-300 px-2 py-1 text-xs"\n                  />\n                  <button\n                    onClick={() => saveRiderRate(area.id)}\n                    className="rounded-md bg-gray-100 px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-200"\n                  >\n                    Save\n                  </button>\n                  <span className="text-xs text-gray-400">ROZZI keeps {Math.max(0, 100 - Number(riderRateByArea[area.id] ?? 92))}% of delivery fee</span>\n                </div>\n'''
          s, _ = replace_once(s, anchor, config_ui, p)
          write(p, s)

          print('Batch 2 source changes applied.')
          PY

      - name: Validate backend and admin
        shell: bash
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run build
          npm test -- --runInBand
          cd ../apps/admin
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit validated batch 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add backend/prisma/schema.prisma backend/prisma/migrations/202609120010_rider_payout_split/migration.sql backend/src/modules/pricing/dto/update-pricing-config.dto.ts backend/create-default-pricing-configs.js backend/src/modules/finance/ledger.service.ts backend/test/unit/ledger-commission.spec.ts apps/admin/src/app/locations/page.tsx
          if git diff --cached --quiet; then
            echo "No batch 2 changes to commit."
          else
            git commit -m "fix: make rider settlement split configurable"
            git push
          fi

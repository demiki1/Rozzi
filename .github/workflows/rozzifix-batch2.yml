# Batch 2: financial funding and cancellation UX hardening.
# Temporary diagnostic: checkout response is printed only during validation.
name: ROZZI batch 2 hardening

on:
  push:
    branches: [codex/rozzifix-batch1]

concurrency:
  group: rozzifix-batch2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: ci_test_access_secret_012345678901234567890123
      JWT_REFRESH_SECRET: ci_test_refresh_secret_012345678901234567890123
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply batch 2 fixes and stale fixtures
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def read(p): return Path(p).read_text(encoding='utf-8-sig')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          p='backend/src/modules/finance/ledger.service.ts'; s=read(p)
          if 'promotion: { select: { vendorId: true } }' not in s:
              s=s.replace('        pricingConfig: { select: { riderPayoutRatePercent: true } },','        pricingConfig: { select: { riderPayoutRatePercent: true } },\n        promotion: { select: { vendorId: true } },',2)
          old='''    const commissionAmount = order.items.reduce(\n      (sum, item) => sum + item.commissionAmountSnapshot,\n      0,\n    );\n    const commissionableMerchandise = order.items.reduce(\n      (sum, item) => sum + item.subtotalAmount,\n      0,\n    );\n    const vendorEarning = Math.max(\n      0,\n      commissionableMerchandise - commissionAmount,\n    );'''
          new='''    const commissionableMerchandise = order.items.reduce((sum, item) => sum + item.subtotalAmount, 0);\n    const promotionDiscount = Math.min(Math.max(0, order.discountAmount), commissionableMerchandise);\n    const vendorFundedPromotion = Boolean(order.promotionId && order.promotion?.vendorId);\n    const netCommissionBase = vendorFundedPromotion ? Math.max(0, commissionableMerchandise - promotionDiscount) : commissionableMerchandise;\n    const grossCommission = order.items.reduce((sum, item) => sum + item.commissionAmountSnapshot, 0);\n    const commissionAmount = vendorFundedPromotion && commissionableMerchandise > 0 ? Math.min(grossCommission, Math.round(grossCommission * netCommissionBase / commissionableMerchandise)) : grossCommission;\n    const vendorEarning = Math.max(0, netCommissionBase - commissionAmount);'''
          if old in s: s=s.replace(old,new,1)
          elif 'const netCommissionBase =' not in s: raise SystemExit('delivery commission block not found')
          anchor='''    await this.record({\n      type: LedgerEntryType.PLATFORM_COMMISSION,\n      accountType: LedgerAccountType.PLATFORM,\n      orderId: order.id,\n      amount: commissionAmount,\n      description: `Commission (${order.commissionRateSnapshot}%) on order ${order.orderNumber}`,\n      idempotencyKey: `order:${order.id}:platform-commission`,\n    });'''
          if 'order:${order.id}:promotion-expense' not in s:
              if anchor not in s: raise SystemExit('platform commission anchor not found')
              s=s.replace(anchor,anchor+'''\n\n    if (promotionDiscount > 0 && !vendorFundedPromotion) {\n      await this.record({ type: LedgerEntryType.PROMOTION, accountType: LedgerAccountType.PLATFORM, orderId: order.id, amount: -promotionDiscount, description: `ROZZI-funded promotion for order ${order.orderNumber}`, idempotencyKey: `order:${order.id}:promotion-expense` });\n    }''',1)
          old2='''    const commission = order.items.reduce(\n      (sum, item) => sum + item.commissionAmountSnapshot,\n      0,\n    );\n    const commissionableMerchandise = order.items.reduce(\n      (sum, item) => sum + item.subtotalAmount,\n      0,\n    );\n    const vendorEarning = Math.max(\n      0,\n      commissionableMerchandise - commission,\n    );'''
          new2='''    const commissionableMerchandise = order.items.reduce((sum, item) => sum + item.subtotalAmount, 0);\n    const promotionDiscount = Math.min(Math.max(0, order.discountAmount), commissionableMerchandise);\n    const vendorFundedPromotion = Boolean(order.promotionId && order.promotion?.vendorId);\n    const netCommissionBase = vendorFundedPromotion ? Math.max(0, commissionableMerchandise - promotionDiscount) : commissionableMerchandise;\n    const grossCommission = order.items.reduce((sum, item) => sum + item.commissionAmountSnapshot, 0);\n    const commission = vendorFundedPromotion && commissionableMerchandise > 0 ? Math.min(grossCommission, Math.round(grossCommission * netCommissionBase / commissionableMerchandise)) : grossCommission;\n    const vendorEarning = Math.max(0, netCommissionBase - commission);'''
          if old2 in s: s=s.replace(old2,new2,1)
          write(p,s)
          p='apps/customer/src/app/orders/[id]/page.tsx'; s=read(p)
          if 'refund is pending' not in s:
              s=s.replace("if(!o)return <main className=\"shell\">Loading…</main>;return <main","if(!o)return <main className=\"shell\">Loading…</main>;const latestPayment=o.payments?.[0];const refundPending=o.status==='CANCELLED'&&latestPayment?.status==='SUCCESS';const refundProcessed=o.status==='CANCELLED'&&latestPayment?.status==='REFUNDED';return <main",1)
              s=s.replace('<div className="status">{o.status}</div>','<div className="status">{o.status}</div>{refundPending&&<div className="card" style={{marginTop:12}}><strong>Refund pending</strong><p className="muted">Your order was cancelled. Your payment has not been refunded yet. ROZZI will process the refund separately.</p></div>}{refundProcessed&&<div className="card" style={{marginTop:12}}><strong>Refund processed</strong><p className="muted">Your refund has been processed.</p></div>}',1)
          write(p,s)
          p='backend/test/unit/ledger-commission.spec.ts'; s=read(p)
          if 'vendor-funded promotion' not in s:
              test='''\n  it('charges a vendor-funded promotion against vendor economics and commission base', async () => {\n    const order = { id:'order-promo-vendor', orderNumber:'RZW-PROMO-1', vendorId:'vendor-1', subtotalAmount:900000, discountAmount:100000, totalAmount:915000, deliveryFeeAmount:0, serviceFeeAmount:15000, commissionRateSnapshot:10, promotionId:'promo-1', promotion:{vendorId:'vendor-1'}, items:[{subtotalAmount:1000000,commissionRateSnapshot:10,commissionAmountSnapshot:100000}], delivery:null };\n    const { prisma, created }=buildPrismaMock(order); const service=new LedgerService(prisma as any,auditLogMock);\n    await service.onOrderTransitioned({orderId:order.id,orderNumber:order.orderNumber,customerId:'customer-1',vendorId:order.vendorId,fromStatus:OrderStatus.PREPARING,toStatus:OrderStatus.DELIVERED,deliveryType:'PICKUP'});\n    expect(created.find(e=>e.type===LedgerEntryType.PLATFORM_COMMISSION&&e.description?.includes('Commission')).amount).toBe(90000);\n    expect(created.find(e=>e.type===LedgerEntryType.VENDOR_EARNING).amount).toBe(810000);\n    expect(created.find(e=>e.type===LedgerEntryType.PROMOTION)).toBeUndefined();\n  });\n\n  it('books a ROZZI-funded promotion as a platform promotion expense', async () => {\n    const order = { id:'order-promo-rozzi', orderNumber:'RZW-PROMO-2', vendorId:'vendor-1', subtotalAmount:900000, discountAmount:100000, totalAmount:915000, deliveryFeeAmount:0, serviceFeeAmount:15000, commissionRateSnapshot:10, promotionId:'promo-2', promotion:{vendorId:null}, items:[{subtotalAmount:1000000,commissionRateSnapshot:10,commissionAmountSnapshot:100000}], delivery:null };\n    const { prisma, created }=buildPrismaMock(order); const service=new LedgerService(prisma as any,auditLogMock);\n    await service.onOrderTransitioned({orderId:order.id,orderNumber:order.orderNumber,customerId:'customer-1',vendorId:order.vendorId,fromStatus:OrderStatus.PREPARING,toStatus:OrderStatus.DELIVERED,deliveryType:'PICKUP'});\n    expect(created.find(e=>e.type===LedgerEntryType.PROMOTION).amount).toBe(-100000);\n    expect(created.find(e=>e.type===LedgerEntryType.VENDOR_EARNING).amount).toBe(900000);\n  });\n'''
              s=s.replace('\n});\n',test+'\n});\n',1)
          write(p,s)
          p='backend/test/e2e/order-lifecycle.e2e-spec.ts'; s=read(p)
          if 'serviceFeeRatePercent: 0' not in s:
              anchor='''    serviceAreaId = serviceArea.id;\n    const zone = await prisma.deliveryZone.create({'''
              replacement='''    serviceAreaId = serviceArea.id;\n    await prisma.pricingConfig.create({ data: { serviceAreaId, serviceFeeRatePercent: 0, serviceFeeCapAmount: 100_000, baseDeliveryFee: 50_000, perKmDeliveryFee: 0, deliveryRadiusKm: 10, riderPayoutRatePercent: 92, isActive: true } });\n    const zone = await prisma.deliveryZone.create({'''
              if anchor not in s: raise SystemExit('e2e pricing fixture anchor not found')
              s=s.replace(anchor,replacement,1)
          if "latitude: 6.51, longitude: 7.51" not in s:
              s=s.replace(".send({ label: 'Home', addressText: '1 Test Street' });",".send({ label: 'Home', addressText: '1 Test Street', latitude: 6.51, longitude: 7.51 });",1)
          if "console.log('E2E checkout response'" not in s:
              s=s.replace(".send({ serviceAreaId, deliveryType: 'DELIVERY', addressId });",".send({ serviceAreaId, deliveryType: 'DELIVERY', addressId });\n    console.log('E2E checkout response', res.status, res.body);",1)
          write(p,s)
          PY

      - name: Validate full repository
        shell: bash
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm test -- --runInBand
          npm run test:e2e -- --runInBand
          cd ../apps/admin && npm ci --no-audit --no-fund && npm run build
          cd ../customer && npm ci --no-audit --no-fund && npm run build
          cd ../vendor && npm ci --no-audit --no-fund && npm run build
          cd ../rider && npm ci --no-audit --no-fund && npm run build

      - name: Commit validated batch 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add backend/src/modules/finance/ledger.service.ts backend/test/unit/ledger-commission.spec.ts backend/test/e2e/order-lifecycle.e2e-spec.ts apps/customer/src/app/orders/[id]/page.tsx .github/workflows/rozzifix-batch2.yml
          if git diff --cached --quiet; then echo "No batch 2 production changes to commit."; else git commit -m "fix: harden promotion funding and cancellation refunds" && git push; fi

name: ROZZI admin hardening validation

on:
  push:
    branches: [codex/rozzifix-batch1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: rozzi-ci-access-secret
      JWT_REFRESH_SECRET: rozzi-ci-refresh-secret
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Prepare database
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Run backend unit tests
        working-directory: backend
        run: npm test -- --runInBand
      - name: Run admin propagation and full E2E tests
        working-directory: backend
        run: npm run test:e2e -- --runInBand
      - name: Build admin frontend
        working-directory: apps/admin
        env:
          NODE_ENV: production
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build all other frontends
        run: |
          cd apps/customer && npm ci --no-audit --no-fund && NODE_ENV=production npm run build
          cd ../vendor && npm ci --no-audit --no-fund && NODE_ENV=production npm run build
          cd ../rider && npm ci --no-audit --no-fund && NODE_ENV=production npm run build

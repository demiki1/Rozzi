name: ROZZI Full End-to-End Business Flow

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rozzifix-batch1

jobs:
  full-business-flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: rozzi-ci-access-secret
      JWT_REFRESH_SECRET: rozzi-ci-refresh-secret
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
    steps:
      - name: Checkout exact hardening branch
        uses: actions/checkout@v4
        with:
          ref: codex/rozzifix-batch1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend unit tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Run critical full order lifecycle
        working-directory: backend
        run: npx jest --config ./test/jest-e2e.json order-lifecycle.e2e-spec.ts --runInBand --detectOpenHandles

      - name: Run all backend E2E tests
        working-directory: backend
        run: npm run test:e2e -- --runInBand

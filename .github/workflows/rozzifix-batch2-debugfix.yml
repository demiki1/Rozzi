name: ROZZI batch 2 debugfix

on:
  push:
    branches: [codex/rozzifix-batch1]

concurrency:
  group: rozzifix-batch2-debugfix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/prisma/schema.prisma'); s=p.read_text(encoding='utf-8-sig')
          if 'riderPayoutRatePercent' not in s:
            s=s.replace('  deliveryRadiusKm Decimal @db.Decimal(6, 2)\n\n  // Surge pricing.', '  deliveryRadiusKm Decimal @db.Decimal(6, 2)\n\n  riderPayoutRatePercent Decimal @default(92) @db.Decimal(5, 2)\n\n  // Surge pricing.',1)
          if 'riderPayoutRateSnapshot' not in s:
            s=s.replace('  commissionRateSnapshot Decimal        @db.Decimal(5, 2)\n  pricingConfigId', '  commissionRateSnapshot Decimal        @db.Decimal(5, 2)\n  riderPayoutRateSnapshot Decimal?       @db.Decimal(5, 2)\n  pricingConfigId',1)
          if 'riderPayoutRatePercent' not in s or 'riderPayoutRateSnapshot' not in s: raise SystemExit('schema patch incomplete')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Patch pricing API and defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/modules/pricing/dto/update-pricing-config.dto.ts'); s=p.read_text(encoding='utf-8-sig')
          if 'riderPayoutRatePercent' not in s:
            s=s.replace('  deliveryRadiusKm?: number;\n\n  @IsOptional()\n  @IsBoolean()\n  surgeEnabled?: boolean;', '  deliveryRadiusKm?: number;\n\n  @IsOptional()\n  @IsNumber({ maxDecimalPlaces: 2 })\n  @Min(0)\n  @Max(100)\n  riderPayoutRatePercent?: number;\n\n  @IsOptional()\n  @IsBoolean()\n  surgeEnabled?: boolean;',1)
          if 'riderPayoutRatePercent' not in s: raise SystemExit('pricing DTO patch incomplete')
          p.write_text(s,encoding='utf-8')
          p=Path('backend/create-default-pricing-configs.js'); s=p.read_text(encoding='utf-8-sig')
          if 'riderPayoutRatePercent' not in s:
            s=s.replace('        deliveryRadiusKm: 8,\n\n        surgeEnabled:', '        deliveryRadiusKm: 8,\n        riderPayoutRatePercent: 92,\n\n        surgeEnabled:',1)
          if 'riderPayoutRatePercent' not in s: raise SystemExit('default config patch incomplete')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Patch ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('backend/src/modules/finance/ledger.service.ts'); s=p.read_text(encoding='utf-8-sig')
          marker='''        items: {\n          select: {\n            subtotalAmount: true,\n            commissionRateSnapshot: true,\n            commissionAmountSnapshot: true,\n          },\n        },\n      },\n    });'''
          replacement='''        items: {\n          select: {\n            subtotalAmount: true,\n            commissionRateSnapshot: true,\n            commissionAmountSnapshot: true,\n          },\n        },\n        pricingConfig: { select: { riderPayoutRatePercent: true } },\n      },\n    });'''
          if 'pricingConfig: { select: { riderPayoutRatePercent: true } }' not in s:
            if marker not in s: raise SystemExit('ledger pricing lookup pattern not found')
            s=s.replace(marker,replacement)
          if 'const riderPayoutRate =' not in s:
            pat=r'''    // Rider payout:.*?    }\n\n    // Service fee'''
            block='''    const riderPayoutRate = Math.min(100, Math.max(0, Number(order.riderPayoutRateSnapshot ?? order.pricingConfig?.riderPayoutRatePercent ?? 92)));\n\n    if (order.riderPayoutRateSnapshot == null) {\n      await this.prisma.order.update({ where: { id: order.id }, data: { riderPayoutRateSnapshot: riderPayoutRate } });\n    }\n\n    if (order.delivery?.riderId && order.deliveryFeeAmount > 0) {\n      const riderEarning = Math.round(order.deliveryFeeAmount * riderPayoutRate / 100);\n      const rozziDeliveryShare = order.deliveryFeeAmount - riderEarning;\n      await this.record({ type: LedgerEntryType.RIDER_EARNING, accountType: LedgerAccountType.RIDER, accountId: order.delivery.riderId, orderId: order.id, amount: riderEarning, description: `Delivery payout (${riderPayoutRate}% rider) for order ${order.orderNumber}`, idempotencyKey: `order:${order.id}:rider-earning` });\n      if (rozziDeliveryShare > 0) await this.record({ type: LedgerEntryType.PLATFORM_COMMISSION, accountType: LedgerAccountType.PLATFORM, orderId: order.id, amount: rozziDeliveryShare, description: `Delivery revenue (${100 - riderPayoutRate}% ROZZI) for order ${order.orderNumber}`, idempotencyKey: `order:${order.id}:delivery-platform-share` });\n    }\n\n    // Service fee'''
            s,n=re.subn(pat,block,s,count=1,flags=re.S)
            if n!=1: raise SystemExit('ledger rider block pattern not found')
          old="    const riderReversal = order.delivery?.riderId ? Math.min(order.deliveryFeeAmount, Math.max(0, refundAmount - vendorReversal - commissionReversal)) : 0;"
          new="    const riderRate = Math.min(100, Math.max(0, Number(order.riderPayoutRateSnapshot ?? order.pricingConfig?.riderPayoutRatePercent ?? 92)));\n    const riderEarned = Math.round(order.deliveryFeeAmount * riderRate / 100);\n    const riderReversal = order.delivery?.riderId ? Math.min(riderEarned, Math.max(0, refundAmount - vendorReversal - commissionReversal)) : 0;"
          if 'const riderEarned =' not in s:
            if old not in s: raise SystemExit('ledger refund pattern not found')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Patch ledger fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/test/unit/ledger-commission.spec.ts'); s=p.read_text(encoding='utf-8-sig')
          if 'update: jest.fn(async ({ data }: any)' not in s:
            s=s.replace('      order: {\n        findUnique: jest.fn(async () => order),\n      },','      order: {\n        findUnique: jest.fn(async () => order),\n        update: jest.fn(async ({ data }: any) => ({ ...order, ...data })),\n      },',1)
          if 'expect(riderEntry.amount).toBe(73_600);' not in s:
            s=s.replace('    expect(riderEntry.amount).toBe(order.deliveryFeeAmount);','    expect(riderEntry.amount).toBe(73_600);\n    expect(created.find((e) => e.description?.includes(\'Delivery revenue (8% ROZZI)\')).amount).toBe(6_400);',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Patch migration
        run: |
          mkdir -p backend/prisma/migrations/202609120010_rider_payout_split
          cat > backend/prisma/migrations/202609120010_rider_payout_split/migration.sql <<'SQL'
          ALTER TABLE "pricing_configs" ADD COLUMN "riderPayoutRatePercent" DECIMAL(5,2) NOT NULL DEFAULT 92.00;
          ALTER TABLE "orders" ADD COLUMN "riderPayoutRateSnapshot" DECIMAL(5,2);
          SQL

      - name: Patch admin dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/admin/src/app/locations/page.tsx'); s=p.read_text(encoding='utf-8-sig')
          if 'riderRateByArea' not in s:
            s=s.replace("  const [error, setError] = useState<string | null>(null);", "  const [error, setError] = useState<string | null>(null);\n  const [riderRateByArea, setRiderRateByArea] = useState<Record<string, string>>({});",1)
            s=s.replace("    api\n      .get<ServiceAreaSummary[]>('/api/admin/service-areas')\n      .then(setServiceAreas)\n      .catch((e) => setError(e.message));", "    api\n      .get<ServiceAreaSummary[]>('/api/admin/service-areas')\n      .then(async (areas) => {\n        setServiceAreas(areas);\n        const configs = await Promise.all(areas.map(async (area) => [area.id, await api.get<any>(`/api/admin/pricing/service-areas/${area.id}`)] as const));\n        setRiderRateByArea(Object.fromEntries(configs.map(([id, config]) => [id, String(config.riderPayoutRatePercent ?? 92)])));\n      })\n      .catch((e) => setError(e.message));",1)
            helper="""\n  async function saveRiderRate(serviceAreaId: string) {\n    const value = Number(riderRateByArea[serviceAreaId]);\n    if (!Number.isFinite(value) || value < 0 || value > 100) { setError('Rider payout rate must be between 0% and 100%.'); return; }\n    try { await api.patch(`/api/admin/pricing/service-areas/${serviceAreaId}`, { riderPayoutRatePercent: value }); setError(null); load(); }\n    catch (err: any) { setError(err.message); }\n  }\n"""
            s=s.replace('  async function setStatus(serviceAreaId: string, status: string) {',helper+'\n  async function setStatus(serviceAreaId: string, status: string) {',1)
            anchor='''                <div className="mt-2 text-xs text-gray-500">\n                  Zones: {area.deliveryZones.map((z) => z.name).join(', ') || 'none yet'}\n                </div>'''
            ui=anchor+'''\n\n                <div className="mt-2 flex items-center gap-2">\n                  <label className="text-xs text-gray-500">Rider payout %</label>\n                  <input type="number" min="0" max="100" step="0.01" value={riderRateByArea[area.id] ?? '92'} onChange={(e) => setRiderRateByArea((prev) => ({ ...prev, [area.id]: e.target.value }))} className="w-20 rounded-md border border-gray-300 px-2 py-1 text-xs" />\n                  <button onClick={() => saveRiderRate(area.id)} className="rounded-md bg-gray-100 px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-200">Save</button>\n                </div>'''
            if anchor not in s: raise SystemExit('admin dashboard anchor not found')
            s=s.replace(anchor,ui,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate backend and admin
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run build
          npm test -- --runInBand
          cd ../apps/admin
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit validated batch 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add backend/prisma/schema.prisma backend/prisma/migrations/202609120010_rider_payout_split/migration.sql backend/src/modules/pricing/dto/update-pricing-config.dto.ts backend/create-default-pricing-configs.js backend/src/modules/finance/ledger.service.ts backend/test/unit/ledger-commission.spec.ts apps/admin/src/app/locations/page.tsx
          git diff --cached --quiet || (git commit -m "fix: make rider settlement split configurable" && git push)

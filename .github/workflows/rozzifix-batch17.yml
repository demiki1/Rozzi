name: ROZZI rider audit validation v17

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/rozzifix-batch1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
      JWT_ACCESS_SECRET: rozzi-ci-access-secret
      JWT_REFRESH_SECRET: rozzi-ci-refresh-secret
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply rider audit patch
        run: |
          python3 .github/patches/batch31.py
          python3 .github/patches/batch32.py
      - name: Validate backend
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm test -- --runInBand
          npm run test:e2e -- --runInBand
      - name: Validate frontends
        run: |
          cd apps/admin && npm ci --no-audit --no-fund && NODE_ENV=production npm run build
          cd ../customer && npm ci --no-audit --no-fund && NODE_ENV=production npm run build
          cd ../vendor && npm ci --no-audit --no-fund && NODE_ENV=production npm run build
          cd ../rider && npm ci --no-audit --no-fund && NODE_ENV=production npm run build

# HONEST SCOPE NOTE: this compose file is for local development and small
# single-server staging.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: []
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/marketplace?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004}
      PAYMENT_PROVIDER: paystack
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
    ports:
      - "4000:4000"
    networks:
      - rozzi_default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:4000/health\").then(r => process.exit(r.ok? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${ADMIN_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"

  customer:
    build:
      context: ./apps/customer
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${CUSTOMER_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3002:3002"

  vendor:
    build:
      context: ./apps/vendor
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${VENDOR_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3003:3003"

  rider:
    build:
      context: ./apps/rider
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${RIDER_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3004:3004"

networks:
  rozzi_default:
    external: true


